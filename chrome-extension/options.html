<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>Stream Deck Chrome Bridge</title>
<style>body{font:16px system-ui;max-width:48rem;margin:2rem auto;line-height:1.7}input[type=text]{width:100%;padding:.6rem;box-sizing:border-box}button{padding:.6rem 1.5rem;margin-top:1rem}code{background:#eee;padding:.2rem}</style></head>
<body><h1>Stream Deck Media Bridge</h1>
<p>この拡張は再生中のページの Media Session 情報と、利用可能なアートワークのみをローカルの Stream Deck プラグインへ送信します。クラウドへアップロードしません。</p>
<p>トークンは Windows の <code>%LOCALAPPDATA%\StreamDeckMediaControls\chrome-token.txt</code> に保存されています。ファイルの文字列を貼り付けてください。</p>
<label><input type="checkbox" id="enabled"> ブラウザからの送信を有効化</label>
<p><label>認証トークン<input id="token" type="text" autocomplete="off" spellcheck="false" placeholder="64桁の16進文字列"></label></p>
<button id="save">保存</button><p id="status" role="status"></p><script src="options.js"></script></body></html>
